# E3：pre-commit 配置
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=10240']
      - id: check-merge-conflict
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.8
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--config=pyproject.toml]
      - id: ruff-format
        name: ruff (format)
        args: [--config=pyproject.toml]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        name: mypy
        additional_dependencies: [pydantic, pydantic-settings, types-python-jose, types-PyJWT]
        args: [--configfile=pyproject.toml]
        pass_filenames: false
        entry: bash -c 'cd backend && mypy app --no-error-summary; exit 0'

  - repo: local
    hooks:
      - id: frontend-typecheck
        name: frontend typecheck
        entry: bash -c 'cd frontend && npm run build 2>&1 | head -20; exit 0'
        language: system
        pass_filenames: false
        files: ^frontend/src/
